<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniZoneFlix Cyber Verify</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        let preloadedShortlink = null;
        const tokenKey = "{{ token }}";
        const shortSt = "{{ short_st }}";
        if (tokenKey) {
            fetch('/api/get_shortener_url?token=' + encodeURIComponent(tokenKey) + '&st=' + encodeURIComponent(shortSt))
                .then(res => res.json())
                .then(data => { if (data && data.url) preloadedShortlink = data.url; })
                .catch(() => {});
        }
        function handleVerifyProceed(event) {
            if (preloadedShortlink) {
                event.preventDefault();
                window.location.href = preloadedShortlink;
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #00ff66;
            --green-soft: #00cc52;
            --dark: #030605;
            --panel: rgba(5, 14, 9, 0.94);
            --muted: #708078;
            --line: rgba(0, 255, 102, 0.18);
        }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px;
            font-family: "Share Tech Mono", monospace; color: var(--green);
            background: radial-gradient(circle at 50% 0%, rgba(0,255,102,.08), transparent 35%), #020403;
            overflow: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 1px, transparent 4px);
            opacity: .35;
        }
        .terminal {
            width: 100%; max-width: 480px; position: relative; z-index: 1; background: var(--panel);
            border: 1px solid var(--green); box-shadow: 0 0 12px rgba(0,255,102,.15), 0 0 45px rgba(0,255,102,.08);
        }
        .terminal-header {
            height: 45px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            border-bottom: 1px solid var(--line); background: rgba(0,255,102,.025);
        }
        .window-title { font-size: 11px; color: #9aa89f; letter-spacing: 1px; }
        .dots { display: flex; gap: 6px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--green); }
        .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .content { padding: 34px 28px 28px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-top { font-size: 11px; color: #617067; letter-spacing: 3px; margin-bottom: 8px; }
        .brand-name { font-size: 22px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0,255,102,.45); }
        .brand-line { width: 70px; height: 1px; margin: 11px auto 0; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .icon {
            width: 68px; height: 68px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--green); background: rgba(0,255,102,.045); box-shadow: 0 0 20px rgba(0,255,102,.12); font-size: 27px;
        }
        h1 { text-align: center; font-size: 23px; letter-spacing: 1px; margin-bottom: 14px; text-shadow: 0 0 10px rgba(0,255,102,.35); }
        .description { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; margin-bottom: 25px; }
        .status-box { border: 1px solid var(--line); background: rgba(0,255,102,.025); padding: 16px; margin-bottom: 22px; }
        .status-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; font-size: 11px; margin-bottom: 11px; }
        .status-row:last-child { margin-bottom: 0; }
        .label { color: #65736b; }
        .value { color: var(--green); text-align: right; }
        .pending { animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: .45; } }
        .btn-cyber {
            width: 100%; padding: 16px 18px; border: 1px solid var(--green); background: var(--green); color: #020403;
            font-family: inherit; font-size: 15px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: .2s ease;
        }
        .btn-cyber:hover { background: var(--green-soft); box-shadow: 0 0 10px var(--green), 0 0 30px rgba(0,255,102,.25); }
        .footer { margin-top: 23px; text-align: center; color: #39433e; font-size: 9px; letter-spacing: 1px; }
        .footer span { color: #536159; }
    </style>
</head>
<body>
    <main class="terminal">
        <header class="terminal-header">
            <div class="window-title">ANIZONEFLIX://SECURITY</div>
            <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
        </header>
        <section class="content">
            <div class="brand">
                <div class="brand-top">SECURE ACCESS NODE</div>
                <div class="brand-name">ANIZONEFLIX</div>
                <div class="brand-line"></div>
            </div>
            <div class="icon">🔐</div>
            <h1>&gt; VERIFY ACCESS_</h1>
            <p class="description">A quick verification is required before accessing your requested Telegram files.</p>
            <div class="status-box">
                <div class="status-row"><span class="label">SYSTEM STATUS</span><span class="value pending">● PENDING</span></div>
                <div class="status-row"><span class="label">VERIFICATION</span><span class="value">REQUIRED</span></div>
                <div class="status-row"><span class="label">SESSION</span><span class="value">10 MINUTES</span></div>
            </div>
            <form action="/go_shortener" method="GET" onsubmit="handleVerifyProceed(event)">
                <input type="hidden" name="token" value="{{ token }}">
                {% if short_st %}<input type="hidden" name="st" value="{{ short_st }}">{% endif %}
                <button type="submit" class="btn-cyber">&gt; INITIALIZE VERIFY &lt;</button>
            </form>
            <div class="footer">CONNECTION: <span>SECURE</span> &nbsp;•&nbsp; ANIZONEFLIX SECURITY</div>
        </section>
    </main>
</body>
</html>
