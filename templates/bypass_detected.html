<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>⚠️ Verification Bypass Detected</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top, #2b090a, #090a0f); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(38, 16, 20, 0.9); backdrop-filter: blur(10px); max-width: 480px; width: 100%; padding: 40px 30px; border-radius: 20px; border: 1px solid rgba(229,9,20,0.3); box-shadow: 0 10px 40px rgba(229,9,20,0.3); text-align: center; }
        .badge { display: inline-block; background: linear-gradient(135deg, #e50914, #b20710); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #ff5252; }
        p { color: #b3b3b3; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn { display: inline-block; width: 100%; background: linear-gradient(135deg, #e50914, #b20710); color: #fff; padding: 16px; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229,9,20,0.6); }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🚫 Bypass Warning</span>
        <h2>BYPASS DETECTED!</h2>
        <p>Verification bypass or non-Chrome browser attempt detected. Access has been restricted and reported to the system owner.</p>
        <p style="font-size: 13px; color: #ff8080;"><b>Notice:</b> You have been temporarily banned for 1 day as a result of using an unsupported browser or bypass tool.</p>
    </div>
</body>
</html>
