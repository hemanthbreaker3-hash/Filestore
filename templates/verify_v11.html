<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniZoneFlix Matrix Verify</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        let preloadedShortlink = null;
        const tokenKey = "{{ token }}";
        const shortSt = "{{ short_st }}";
        if (tokenKey) {
            fetch('/api/get_shortener_url?token=' + encodeURIComponent(tokenKey) + '&st=' + encodeURIComponent(shortSt))
                .then(res => res.json())
                .then(data => { if (data && data.url) preloadedShortlink = data.url; })
                .catch(() => {});
        }
        function handleVerifyProceed(event) {
            if (preloadedShortlink) {
                event.preventDefault();
                window.location.href = preloadedShortlink;
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Share Tech Mono', monospace; background: #000; color: #22c55e; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(5, 46, 22, 0.9); max-width: 470px; width: 100%; padding: 40px; border-radius: 16px; border: 1px solid #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.25); text-align: center; }
        .icon { font-size: 40px; margin-bottom: 15px; }
        h1 { font-size: 24px; font-weight: bold; margin-bottom: 12px; color: #4ade80; text-shadow: 0 0 10px #22c55e; }
        p { color: #86efac; font-size: 13px; line-height: 1.7; margin-bottom: 28px; }
        .btn { width: 100%; background: #22c55e; color: #000; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; transition: all 0.25s; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .btn:hover { background: #4ade80; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📟</div>
        <h1>MATRIX STREAM VERIFY</h1>
        <p>&gt; Security handshake required. Click below to verify access token and receive payload.</p>
        <form action="/go_shortener" method="GET" onsubmit="handleVerifyProceed(event)">
            <input type="hidden" name="token" value="{{ token }}">
            {% if short_st %}<input type="hidden" name="st" value="{{ short_st }}">{% endif %}
            <button type="submit" class="btn">&gt; RUN VERIFY &lt;</button>
        </form>
    </div>
</body>
</html>
