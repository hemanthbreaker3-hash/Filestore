<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AniZoneFlix Glass Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        let preloadedShortlink = null;
        const tokenKey = "{{ token }}";
        const shortSt = "{{ short_st }}";
        if (tokenKey) {
            fetch('/api/get_shortener_url?token=' + encodeURIComponent(tokenKey) + '&st=' + encodeURIComponent(shortSt))
                .then(res => res.json())
                .then(data => { if (data && data.url) preloadedShortlink = data.url; })
                .catch(() => {});
        }
        function handleVerifyProceed(event) {
            if (preloadedShortlink) {
                event.preventDefault();
                window.location.href = preloadedShortlink;
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(18px); max-width: 460px; width: 100%; padding: 40px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        .icon-box { font-size: 44px; margin-bottom: 16px; }
        h2 { font-size: 26px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .btn-glass { display: inline-block; width: 100%; background: linear-gradient(135deg, #0284c7, #4f46e5); color: #fff; padding: 16px; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 16px; border: none; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 25px rgba(2, 132, 199, 0.3); }
        .btn-glass:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(2, 132, 199, 0.45); }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="icon-box">🛡️</div>
        <h2>AniZoneFlix Verification</h2>
        <p>Quick browser verification required before unlocking your requested Telegram files.</p>
        <form action="/go_shortener" method="GET" onsubmit="handleVerifyProceed(event)">
            <input type="hidden" name="token" value="{{ token }}">
            {% if short_st %}<input type="hidden" name="st" value="{{ short_st }}">{% endif %}
            <button type="submit" class="btn-glass">Verify & Continue 🚀</button>
        </form>
    </div>
</body>
</html>
